<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintena — Equipment & Maintenance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#172235;--muted:#718096;--line:#e7edf4;--blue:#2563eb;--blue2:#eaf1ff;--green:#0f9f6e;--red:#dc4c4c;--amber:#d99017;--nav:#101d33;--shadow:0 8px 28px #1a2b4610}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0f1e36,#1c3b68)}
.login-card{width:min(420px,100%);background:#fff;border-radius:20px;padding:34px;box-shadow:0 24px 70px #0003}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:22px}.login-card h1{font-size:25px;margin:28px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:12px;font-weight:700;color:#526176}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}.field textarea{min-height:75px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;font-size:13px;background:var(--blue);color:#fff}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#edf2f8;color:#34445a}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn.full{width:100%;padding:12px}.error{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--nav);color:#d9e3f3;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.sidebar .brand{padding:0 10px 28px;color:#fff}.sidebar .brand-mark{background:#3478f6}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#7f91ac;padding:14px 12px 8px;font-weight:800}.nav-btn{width:100%;border:0;background:transparent;color:#b9c7da;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:#223653;color:#fff}.nav-btn .ico{width:18px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;border-top:1px solid #2b3b53;padding:15px 8px 0;font-size:11px;color:#8ea0b8}
.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top-title{font-weight:800;font-size:17px}.userbox{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-weight:800}
.content{padding:28px 30px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.page-head h1{font-size:23px;margin:0 0 6px}.page-head p{font-size:12px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--blue2);display:grid;place-items:center;font-size:17px}.stat-value{font-size:27px;font-weight:800;margin-top:13px}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:18px}.panel{padding:19px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-head h3{font-size:14px;margin:0}.panel-head span{font-size:11px;color:var(--muted)}.chartbox{height:230px;position:relative}.table-panel{padding:0;overflow:hidden}.table-head{padding:18px 19px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.table-head h3{font-size:14px;margin:0}.table-tools{display:flex;gap:8px;align-items:center}.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;width:210px;outline:none}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px 17px;text-align:left;border-bottom:1px solid #edf1f6;font-size:12px;white-space:nowrap}th{background:#fafbfd;color:#7b899b;font-size:10px;text-transform:uppercase;letter-spacing:.5px}td{color:#34445a}tbody tr:hover{background:#fafcff}.empty{text-align:center;padding:35px;color:var(--muted)}
.badge{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#edf2f7;color:#59677a}.badge.green{background:#e7f8f0;color:#0d8b60}.badge.red{background:#fff0f0;color:#c83e3e}.badge.amber{background:#fff6e5;color:#ae7410}.badge.blue{background:#eaf1ff;color:#2563eb}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.form-grid .wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.modal-backdrop{position:fixed;inset:0;background:#0d1b2d80;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 80px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f0f3f8;border-radius:8px;width:30px;height:30px;font-size:18px}.alert-list{display:flex;flex-direction:column;gap:9px}.alert-item{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:9px;font-size:12px}.muted{color:var(--muted)}.mobile-menu{display:none}
@media(max-width:1050px){.sidebar{width:215px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{position:fixed;z-index:15;left:-260px;top:0;bottom:0;transition:.2s}.sidebar.open{left:0}.topbar{padding:0 16px}.content{padding:20px 15px}.mobile-menu{display:inline-block;border:0;background:#eef3fb;padding:8px 10px;border-radius:8px;margin-right:10px}.grid2{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:23px}.search{width:140px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">⚙</div><div>MAINTENA</div></div>
    <h1>Welcome back</h1><div class="sub">Sign in to manage your equipment, maintenance activities and spare parts inventory.</div>
    <form id="loginForm">
      <div class="field"><label>Email address</label><input id="email" type="email" required autocomplete="username" placeholder="name@company.com"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></div>
      <button class="btn full" type="submit">Sign in</button><div id="loginError" class="error"></div>
    </form>
  </div>
</div>
<div id="app" class="app hidden">
<aside id="sidebar" class="sidebar">
  <div class="brand"><div class="brand-mark">⚙</div><div>MAINTENA</div></div>
  <div class="nav-label">Workspace</div>
  <button class="nav-btn active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button class="nav-btn" data-page="equipment"><span class="ico">🚜</span>Equipment</button>
  <button class="nav-btn" data-page="maintenance"><span class="ico">🔧</span>Maintenance Records</button>
  <button class="nav-btn" data-page="types"><span class="ico">🧰</span>Maintenance Types</button>
  <button class="nav-btn" data-page="hours"><span class="ico">⏱</span>Operating Hours</button>
  <div class="nav-label">Inventory</div>
  <button class="nav-btn" data-page="parts"><span class="ico">📦</span>Spare Parts</button>
  <button class="nav-btn" data-page="warehouses"><span class="ico">🏬</span>Warehouses</button>
  <button class="nav-btn" data-page="suppliers"><span class="ico">🚚</span>Suppliers</button>
  <button class="nav-btn" data-page="stock"><span class="ico">⇄</span>Stock Transactions</button>
  <div class="nav-label">Operations</div>
  <button class="nav-btn" data-page="workorders"><span class="ico">📋</span>Work Orders</button>
  <button class="nav-btn" data-page="reports"><span class="ico">▤</span>Equipment Reports</button>
  <div class="sidebar-bottom">Equipment & Maintenance Management<br>Connected to Supabase</div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center"><button class="mobile-menu" id="mobileMenu">☰</button><div class="top-title" id="topTitle">Dashboard</div></div><div class="userbox"><span id="userEmail">Signed in</span><div class="avatar">A</div><button class="btn secondary small" id="logoutBtn">Sign out</button></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div id="modalHost"></div>
<script>
const SUPABASE_URL = "https://arayncqksyddiygkbjzg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FueLZy87Cb5FPnC6I1tDjw_kI2gDPn8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const date = v => v ? new Date(v).toLocaleDateString("en-GB") : "—";
const state = {page:"dashboard",equipment:[],types:[],maintenance:[],hours:[],parts:[],warehouses:[],suppliers:[],balances:[],stock:[],workorders:[]};
const titles={dashboard:"Dashboard",equipment:"Equipment",maintenance:"Maintenance Records",types:"Maintenance Types",hours:"Operating Hours",parts:"Spare Parts",warehouses:"Warehouses",suppliers:"Suppliers",stock:"Stock Transactions",workorders:"Work Orders",reports:"Equipment Reports"};
async function query(table,select="*"){const {data,error}=await db.from(table).select(select).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function loadAll(){
 const jobs=[["equipment","*"],["maintenance_types","*"],["maintenance_records","*,equipment(equipment_code,equipment_model),maintenance_types(maintenance_name)"],["operating_hour_logs","*,equipment(equipment_code,equipment_model)"],["spare_parts","*,suppliers(supplier_name)"],["warehouses","*"],["suppliers","*"],["stock_balances","*,warehouses(warehouse_name),spare_parts(part_code,part_name,minimum_stock)"],["stock_transactions","*,spare_parts(part_name,part_code),warehouses(warehouse_name),equipment(equipment_code)"],["work_orders","*,equipment(equipment_code,equipment_model)"]];
 const keys=["equipment","types","maintenance","hours","parts","warehouses","suppliers","balances","stock","workorders"];
 const results=await Promise.all(jobs.map(async ([t,s])=>{const {data,error}=await db.from(t).select(s).order("created_at",{ascending:false});if(error)throw new Error(t+": "+error.message);return data||[]}));
 keys.forEach((k,i)=>state[k]=results[i]); render();
}
function pageHead(title,desc,action=""){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,icon,note=""){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function badge(s){let x=String(s||"").toLowerCase(),c=["active","completed","available","closed","receipt","return"].includes(x)?"green":["out of service","overdue","cancelled","issue"].includes(x)?"red":["under maintenance","in progress","pending","adjustment"].includes(x)?"amber":"blue";return `<span class="badge ${c}">${esc(s||"—")}</span>`}
function table(title,headers,rows,search=true){return `<section class="panel table-panel"><div class="table-head"><h3>${title}</h3><div class="table-tools">${search?'<input class="search" placeholder="Search..." oninput="filterTable(this)">':""}</div></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}" class="empty">No records found yet</td></tr>`}</tbody></table></div></section>`}
function filterTable(input){const q=input.value.toLowerCase(),body=input.closest(".table-panel").querySelector("tbody");[...body.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
function render(){
 $("topTitle").textContent=titles[state.page]||"Dashboard";document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 const p=state.page;let html="";
 if(p==="dashboard"){
  const active=state.equipment.filter(x=>x.status==="Active").length, due=state.equipment.filter(x=>Number(x.current_operating_hours||0)>=Number(x.next_maintenance_due_hours||Infinity)).length;
  const low=state.balances.filter(b=>b.spare_parts&&Number(b.quantity)<=Number(b.spare_parts.minimum_stock||0));
  html=pageHead("Good day 👋","Here is an overview of your maintenance operations.")+
  `<div class="stats">${stat("Total Equipment",state.equipment.length,"🚜","Registered assets")}${stat("Maintenance Records",state.maintenance.length,"🔧","All recorded activities")}${stat("Active Equipment",active,"✓","Currently operational")}${stat("Low Stock Items",low.length,"📦","At or below minimum level")}</div>
  <div class="grid2"><div class="panel"><div class="panel-head"><h3>Equipment Status</h3><span>Current fleet overview</span></div><div class="chartbox"><canvas id="statusChart"></canvas></div></div><div class="panel"><div class="panel-head"><h3>Inventory Alerts</h3><span>${low.length} alerts</span></div><div class="alert-list">${low.length?low.slice(0,6).map(b=>`<div class="alert-item"><span><b>${esc(b.spare_parts?.part_name)}</b><br><span class="muted">${esc(b.warehouses?.warehouse_name||"Warehouse")}</span></span><b class="badge red">${b.quantity} left</b></div>`).join(""):'<div class="empty">No low-stock alerts</div>'}</div></div></div>
  <div class="grid2"><div class="panel"><div class="panel-head"><h3>Maintenance Activity</h3><span>Recent records</span></div><div class="chartbox"><canvas id="maintChart"></canvas></div></div><div class="panel"><div class="panel-head"><h3>Quick Overview</h3><span>Operations snapshot</span></div><div class="alert-list"><div class="alert-item"><span>Warehouses</span><b>${state.warehouses.length}</b></div><div class="alert-item"><span>Spare Parts</span><b>${state.parts.length}</b></div><div class="alert-item"><span>Suppliers</span><b>${state.suppliers.length}</b></div><div class="alert-item"><span>Open Work Orders</span><b>${state.workorders.filter(w=>!["Completed","Closed"].includes(w.status)).length}</b></div></div></div></div>`;
 }else if(p==="equipment"){
  html=pageHead("Equipment","Register and monitor your generators, machines and vehicles.",'<button class="btn" onclick="openForm(\'equipment\')">+ Add Equipment</button>')+table("Equipment Register",["Code","Model","Serial Number","Project","Location","Operating Hours","Status"],state.equipment.map(x=>`<tr><td><b>${esc(x.equipment_code)}</b></td><td>${esc(x.equipment_model)}</td><td>${esc(x.serial_number)}</td><td>${esc(x.project)}</td><td>${esc(x.current_location)}</td><td>${Number(x.current_operating_hours||0).toLocaleString()}</td><td>${badge(x.status)}</td></tr>`));
 }else if(p==="maintenance"){
  html=pageHead("Maintenance Records","Track completed and planned maintenance activities.",'<button class="btn" onclick="openForm(\'maintenance\')">+ Add Record</button>')+table("Maintenance History",["Date","Equipment","Maintenance Type","Operating Hours","Description","Total Cost"],state.maintenance.map(x=>`<tr><td>${date(x.maintenance_date)}</td><td>${esc(x.equipment?.equipment_code||"—")}</td><td>${esc(x.maintenance_types?.maintenance_name||"—")}</td><td>${x.operating_hours??"—"}</td><td>${esc(x.maintenance_description)}</td><td>${money(x.total_cost)}</td></tr>`));
 }else if(p==="types"){
  html=pageHead("Maintenance Types","Configure service types and their maintenance intervals.",'<button class="btn" onclick="openForm(\'types\')">+ Add Type</button>')+table("Maintenance Types",["Name","Interval (Hours)","Description"],state.types.map(x=>`<tr><td><b>${esc(x.maintenance_name)}</b></td><td>${x.interval_hours??"—"}</td><td>${esc(x.description)}</td></tr>`));
 }else if(p==="hours"){
  html=pageHead("Operating Hours","Record equipment meter readings and daily usage.",'<button class="btn" onclick="openForm(\'hours\')">+ Add Reading</button>')+table("Operating Hour Log",["Date","Equipment","Hours","Project","Location","Diesel Consumption"],state.hours.map(x=>`<tr><td>${date(x.log_date)}</td><td>${esc(x.equipment?.equipment_code||"—")}</td><td>${x.operating_hours}</td><td>${esc(x.project)}</td><td>${esc(x.location)}</td><td>${x.diesel_consumption??"—"}</td></tr>`));
 }else if(p==="parts"){
  html=pageHead("Spare Parts","Manage spare part catalog, prices and minimum stock levels.",'<button class="btn" onclick="openForm(\'parts\')">+ Add Spare Part</button>')+table("Spare Parts Catalog",["Part Code","Part Name","Category","Unit","Supplier","Purchase Price","Minimum Stock"],state.parts.map(x=>`<tr><td><b>${esc(x.part_code)}</b></td><td>${esc(x.part_name)}</td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td>${esc(x.suppliers?.supplier_name)}</td><td>${money(x.purchase_price)}</td><td>${x.minimum_stock??0}</td></tr>`));
 }else if(p==="warehouses"){
  html=pageHead("Warehouses","Manage storage locations and warehouse details.",'<button class="btn" onclick="openForm(\'warehouses\')">+ Add Warehouse</button>')+table("Warehouse List",["Code","Warehouse Name","Location","Notes"],state.warehouses.map(x=>`<tr><td><b>${esc(x.warehouse_code)}</b></td><td>${esc(x.warehouse_name)}</td><td>${esc(x.location)}</td><td>${esc(x.notes)}</td></tr>`));
 }else if(p==="suppliers"){
  html=pageHead("Suppliers","Maintain supplier contacts and purchasing information.",'<button class="btn" onclick="openForm(\'suppliers\')">+ Add Supplier</button>')+table("Supplier Directory",["Code","Supplier","Contact Person","Phone","Email","Address"],state.suppliers.map(x=>`<tr><td>${esc(x.supplier_code)}</td><td><b>${esc(x.supplier_name)}</b></td><td>${esc(x.contact_person)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.address)}</td></tr>`));
 }else if(p==="stock"){
  html=pageHead("Stock Transactions","Record stock receipts, issues, returns and adjustments.",'<button class="btn" onclick="openForm(\'stock\')">+ New Transaction</button>')+table("Transaction History",["Date","Type","Part","Warehouse","Equipment","Quantity","Unit Price","Reference"],state.stock.map(x=>`<tr><td>${date(x.transaction_date)}</td><td>${badge(x.transaction_type)}</td><td>${esc(x.spare_parts?.part_name)}</td><td>${esc(x.warehouses?.warehouse_name)}</td><td>${esc(x.equipment?.equipment_code)}</td><td>${x.quantity}</td><td>${money(x.unit_price)}</td><td>${esc(x.reference_number)}</td></tr>`));
 }else if(p==="workorders"){
  html=pageHead("Work Orders","Plan, assign and follow up equipment repair jobs.",'<button class="btn" onclick="openForm(\'workorders\')">+ Create Work Order</button>')+table("Work Order Register",["Work Order","Equipment","Title","Priority","Status","Opened","Assigned To"],state.workorders.map(x=>`<tr><td><b>${esc(x.work_order_number)}</b></td><td>${esc(x.equipment?.equipment_code||"—")}</td><td>${esc(x.title)}</td><td>${badge(x.priority)}</td><td>${badge(x.status)}</td><td>${date(x.opened_at)}</td><td>${esc(x.assigned_to)}</td></tr>`));
 }else if(p==="reports"){
  html=pageHead("Equipment Reports","Review parts usage and maintenance cost by equipment.")+`<div class="panel"><div class="panel-head"><h3>Equipment Summary</h3><span>${state.equipment.length} assets</span></div>${state.equipment.map(e=>{const rec=state.maintenance.filter(m=>m.equipment_id===e.id);return `<div class="alert-item"><span><b>${esc(e.equipment_code)} — ${esc(e.equipment_model)}</b><br><span class="muted">${rec.length} maintenance records · ${e.current_operating_hours||0} operating hours</span></span><b>${money(rec.reduce((a,m)=>a+Number(m.total_cost||0),0))}</b></div>`}).join("")||'<div class="empty">No equipment registered</div>'}</div>`;
 }
 $("content").innerHTML=html;
 if(p==="dashboard")drawCharts();
}
let charts=[];
function drawCharts(){charts.forEach(c=>c.destroy());charts=[];const canvas=$("statusChart");if(!canvas)return;
 const counts={};state.equipment.forEach(e=>counts[e.status||"Unknown"]=(counts[e.status||"Unknown"]||0)+1);
 charts.push(new Chart(canvas,{type:"doughnut",data:{labels:Object.keys(counts),datasets:[{data:Object.values(counts),backgroundColor:["#2563eb","#16a477","#e3a12c","#e15b64","#8795a8"],borderWidth:0}]},options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8,font:{size:10}}}}}}));
 const c2=$("maintChart");const months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);return d.toLocaleString("en",{month:"short",year:"2-digit"})});const values=months.map(label=>state.maintenance.filter(m=>{let d=new Date(m.maintenance_date);return d.toLocaleString("en",{month:"short",year:"2-digit"})===label}).length);
 charts.push(new Chart(c2,{type:"bar",data:{labels:months,datasets:[{label:"Maintenance records",data:values,backgroundColor:"#4c83f2",borderRadius:6,maxBarThickness:28}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false}}}}}));
}
function options(list,labelField,valueField){return list.map(x=>`<option value="${esc(x[valueField])}">${esc(x[labelField])}</option>`).join("")}
function field(label,name,type="text",required=false,wide=false,extra=""){return `<div class="field ${wide?"wide":""}"><label>${label}${required?" *":""}</label>${type==="textarea"?`<textarea name="${name}" ${required?"required":""} ${extra}></textarea>`:`<input name="${name}" type="${type}" ${required?"required":""} ${extra}>`}</div>`}
function selectField(label,name,opts,required=true,wide=false){return `<div class="field ${wide?"wide":""}"><label>${label}${required?" *":""}</label><select name="${name}" ${required?"required":""}><option value="">Select ${label}</option>${opts}</select></div>`}
function openForm(kind){
 let title="",body="";
 if(kind==="equipment"){title="Add Equipment";body=field("Equipment Code","equipment_code","text",true)+field("Equipment Model","equipment_model","text",true)+field("Serial Number","serial_number")+field("Project","project")+field("Current Location","current_location")+field("Current Operating Hours","current_operating_hours","number",false,false,'min="0" step="0.1"')+field("Last Maintenance Date","last_maintenance_date","date")+field("Next Maintenance Due Hours","next_maintenance_due_hours","number",false,false,'min="0" step="0.1"')+selectField("Status","status",["Active","Under Maintenance","Out of Service"].map(v=>`<option>${v}</option>`).join(""))+field("Notes","notes","textarea",false,true)}
 if(kind==="types"){title="Add Maintenance Type";body=field("Maintenance Name","maintenance_name","text",true)+field("Interval Hours","interval_hours","number")+field("Description","description","textarea",false,true)}
 if(kind==="maintenance"){title="Add Maintenance Record";body=selectField("Equipment","equipment_id",options(state.equipment,"equipment_code","id"))+selectField("Maintenance Type","maintenance_type_id",options(state.types,"maintenance_name","id"))+field("Maintenance Date","maintenance_date","date",true)+field("Operating Hours","operating_hours","number")+field("Description","maintenance_description","text",false,true)+field("Parts Replaced","parts_replaced","textarea",false,true)+field("Labor Cost","labor_cost","number")+field("Spare Parts Cost","spare_parts_cost","number")+field("Next Due Hours","next_due_hours","number")+field("Performed By","performed_by")+field("Remarks","remarks","textarea",false,true)}
 if(kind==="hours"){title="Add Operating Hours";body=selectField("Equipment","equipment_id",options(state.equipment,"equipment_code","id"))+field("Log Date","log_date","date",true)+field("Operating Hours","operating_hours","number",true)+field("Project","project")+field("Location","location")+field("Diesel Consumption","diesel_consumption","number")+field("Notes","notes","textarea",false,true)}
 if(kind==="parts"){title="Add Spare Part";body=field("Part Code","part_code","text",true)+field("Part Name","part_name","text",true)+field("Category","category")+field("Unit","unit")+selectField("Supplier","supplier_id",`<option value="">No supplier</option>`+options(state.suppliers,"supplier_name","id"),false)+field("Purchase Price","purchase_price","number")+field("Selling Price","selling_price","number")+field("Minimum Stock","minimum_stock","number")}
 if(kind==="warehouses"){title="Add Warehouse";body=field("Warehouse Code","warehouse_code","text",true)+field("Warehouse Name","warehouse_name","text",true)+field("Location","location")+field("Notes","notes","textarea",false,true)}
 if(kind==="suppliers"){title="Add Supplier";body=field("Supplier Code","supplier_code")+field("Supplier Name","supplier_name","text",true)+field("Contact Person","contact_person")+field("Phone","phone")+field("Email","email","email")+field("Address","address")+field("Notes","notes","textarea",false,true)}
 if(kind==="stock"){title="New Stock Transaction";body=selectField("Transaction Type","transaction_type",["Receipt","Issue","Return","Adjustment"].map(v=>`<option>${v}</option>`).join(""))+selectField("Warehouse","warehouse_id",options(state.warehouses,"warehouse_name","id"))+selectField("Spare Part","spare_part_id",options(state.parts,"part_name","id"))+field("Quantity","quantity","number",true,false,'min="0.01" step="0.01"')+field("Unit Price","unit_price","number")+selectField("Equipment (optional)","equipment_id",'<option value="">Not linked</option>'+options(state.equipment,"equipment_code","id"),false)+selectField("Work Order (optional)","work_order_id",'<option value="">Not linked</option>'+options(state.workorders,"work_order_number","id"),false)+selectField("Supplier (optional)","supplier_id",'<option value="">Not linked</option>'+options(state.suppliers,"supplier_name","id"),false)+field("Transaction Date","transaction_date","date",true)+field("Reference Number","reference_number")+field("Notes","notes","textarea",false,true)}
 if(kind==="workorders"){title="Create Work Order";body=field("Work Order Number","work_order_number","text",true)+selectField("Equipment","equipment_id",options(state.equipment,"equipment_code","id"))+field("Title","title","text",true,false)+field("Description","description","textarea",false,true)+selectField("Priority","priority",["Low","Medium","High","Critical"].map(v=>`<option>${v}</option>`).join(""))+selectField("Status","status",["Open","In Progress","Completed","On Hold","Cancelled"].map(v=>`<option>${v}</option>`).join(""))+field("Assigned To","assigned_to")+field("Labor Cost","labor_cost","number")+field("Notes","notes","textarea",false,true)}
 $("modalHost").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><form id="dataForm" data-kind="${kind}"><div class="form-grid">${body}</div><div class="form-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save Record</button></div><div id="formError" class="error"></div></form></div></div>`;
 const dateInput=$("dataForm").querySelector('input[type="date"]');if(dateInput)dateInput.value=new Date().toISOString().slice(0,10);
 $("dataForm").addEventListener("submit",saveForm);
}
function closeModal(){$("modalHost").innerHTML=""}
async function saveForm(e){
 e.preventDefault();const form=e.target,kind=form.dataset.kind,fd=new FormData(form),data=Object.fromEntries(fd.entries());
 form.querySelector("button[type=submit]").disabled=true;
 const map={equipment:"equipment",types:"maintenance_types",maintenance:"maintenance_records",hours:"operating_hour_logs",parts:"spare_parts",warehouses:"warehouses",suppliers:"suppliers",stock:"stock_transactions",workorders:"work_orders"};
 const numeric={current_operating_hours:1,next_maintenance_due_hours:1,interval_hours:1,operating_hours:1,labor_cost:1,spare_parts_cost:1,next_due_hours:1,diesel_consumption:1,purchase_price:1,selling_price:1,minimum_stock:1,quantity:1,unit_price:1};
 Object.keys(data).forEach(k=>{if(data[k]==="")data[k]=null;else if(numeric[k])data[k]=Number(data[k])});
 if(kind==="maintenance")data.total_cost=Number(data.labor_cost||0)+Number(data.spare_parts_cost||0);
 if(kind==="workorders")data.opened_at=new Date().toISOString();
 if(kind==="stock"||kind==="hours"){} 
 const {error}=await db.from(map[kind]).insert(data);
 if(error){$("formError").textContent=error.message;form.querySelector("button[type=submit]").disabled=false;return}
 closeModal();try{await loadAll()}catch(err){alert("Saved, but refresh failed: "+err.message)}
}
function showError(msg){$("content").innerHTML=`<div class="panel"><h3>Unable to load data</h3><p class="muted">${esc(msg)}</p><p class="muted">Please check your Supabase table permissions and connection. No data has been deleted.</p><button class="btn" onclick="loadAll().catch(e=>showError(e.message))">Try Again</button></div>`}
async function enterApp(session){$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");$("userEmail").textContent=session.user.email||"Signed in";try{await loadAll()}catch(e){showError(e.message)}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="Signing in...";const {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginError").textContent=error.message;return}await enterApp(data.session)});
$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden")});
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{state.page=b.dataset.page;render();$("sidebar").classList.remove("open")}));
$("mobileMenu").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
db.auth.getSession().then(({data})=>{if(data.session)enterApp(data.session)});
</script>
</body>
</html>
