<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#f3f5f9;color:#222}
header{background:#172b4d;color:white;padding:22px;font-size:22px}
main{max-width:500px;margin:60px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 3px 15px #ddd}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:16px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
#message{margin-top:15px;color:#b22}
</style>
</head>
<body>
<header>Maintenance Management System</header>
<main>
<h2>Admin Login</h2>
<p>Sign in to manage equipment and maintenance.</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="message"></div>
</main>

<script>
const SUPABASE_URL = "https://arayncqksyddiygkbjzg.supabase.co";
const SUPABASE_KEY = "sb_publishable_FueLZy87Cb5FPnC6I1tDjw_kI2gDPn8";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Signing in...";

  const {data,error} = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    message.textContent = error.message;
    return;
  }

  message.style.color = "green";
  message.textContent = "Login successful!";
}
</script>
</body>
</html>
